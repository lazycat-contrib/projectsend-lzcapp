version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: app

build:
  toolchains: []
  run_buildscript: false

images:
  - id: app
    target: service
    service: app
    source: docker.io/projectsend/projectsend
    channel: stable
    sort: semver
    tag_regex: '^\d+\.\d+\.\d+$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: ProjectSend
    summary: ProjectSend is a free, open source software that lets you share files with your clients, focused on ease of use and privacy.
