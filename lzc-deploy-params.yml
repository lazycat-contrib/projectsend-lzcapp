params:
  - id: admin_name
    type: string
    name: Administrator Name
    description: Display name used only when creating the first ProjectSend administrator; changing it later does not update the account
    default_value: Administrator
    optional: false

  - id: admin_email
    type: string
    name: Administrator Email
    description: Email used only when creating the first administrator; changing it later does not update the existing account
    optional: false

  - id: admin_password
    type: secret
    name: Administrator Password
    description: Password for the initial administrator; changing this value after first installation does not reset the existing account
    default_value: "$random(len=24)"
    optional: false

locales:
  zh:
    admin_name:
      name: 管理员名称
      description: 仅在首次创建 ProjectSend 管理员时使用；后续修改不会更新已有账号
    admin_email:
      name: 管理员邮箱
      description: 仅在首次创建管理员时使用；后续修改不会更新已有账号
    admin_password:
      name: 管理员密码
      description: 初始管理员密码；首次安装后修改此参数不会重置已有账号密码
  en:
    admin_name:
      name: Administrator Name
      description: Used only to create the first administrator; later changes do not update the account
    admin_email:
      name: Administrator Email
      description: Used only to create the first administrator; later changes do not update the account
    admin_password:
      name: Administrator Password
      description: Initial administrator password; changing this after installation does not reset an existing account
